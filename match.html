<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>試合入力 | Handball Stats Hub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/match.css">

    <script defer src="js/storage.js"></script>
    <script defer src="js/match.js"></script>
</head>

<body>

<header class="match-header">

    <button
        type="button"
        class="back-button"
        onclick="location.href='index.html'">
        ←
    </button>

    <div class="match-title">
        <h1>試合入力</h1>
        <span id="matchStatus">NEW MATCH</span>
    </div>

    <button
        type="button"
        class="running-score-button"
        onclick="openRunningScore()">
        SCORE
    </button>

</header>


<main class="match-container">

    <!-- =========================
         試合作成
    ========================== -->

    <section
        id="matchSetup"
        class="match-card setup-card">

        <div class="card-title">
            <h2>試合情報</h2>
        </div>

        <div class="form-grid">

            <label class="form-field">
                <span>大会名</span>
                <input
                    type="text"
                    id="competition"
                    placeholder="大会名">
            </label>

            <label class="form-field">
                <span>日付</span>
                <input
                    type="date"
                    id="matchDate">
            </label>

            <label class="form-field">
                <span>自チーム</span>
                <input
                    type="text"
                    id="homeTeam"
                    placeholder="自チーム名">
            </label>

            <label class="form-field">
                <span>相手チーム</span>
                <input
                    type="text"
                    id="awayTeam"
                    placeholder="相手チーム名">
            </label>

        </div>

        <button
            type="button"
            id="createMatchButton"
            class="primary-button">
            試合を開始する
        </button>

    </section>


    <!-- =========================
         試合中ヘッダー
    ========================== -->

    <section
        id="liveMatchArea"
        class="live-match-area hidden">

        <div class="score-header">

            <div class="team-score home-score">

                <span
                    id="displayHomeTeam"
                    class="team-name">
                    自チーム
                </span>

                <strong id="homeScore">
                    0
                </strong>

            </div>


            <div class="match-clock">

                <span id="periodDisplay">
                    前半
                </span>

                <strong id="matchClock">
                    00:00
                </strong>

                <div class="clock-controls">

                    <button
                        type="button"
                        id="clockStartButton">
                        START
                    </button>

                    <button
                        type="button"
                        id="clockStopButton">
                        STOP
                    </button>

                </div>

            </div>


            <div class="team-score away-score">

                <span
                    id="displayAwayTeam"
                    class="team-name">
                    相手チーム
                </span>

                <strong id="awayScore">
                    0
                </strong>

            </div>

        </div>


        <!-- =========================
             チーム切替
        ========================== -->

        <div class="team-switch">

            <button
                type="button"
                class="team-switch-button active"
                data-team="home"
                id="homeTeamButton">
                自チーム
            </button>

            <button
                type="button"
                class="team-switch-button"
                data-team="away"
                id="awayTeamButton">
                相手チーム
            </button>

        </div>


        <!-- =========================
             現在の入力情報
        ========================== -->

        <section class="input-status-card">

            <div>
                <span>TEAM</span>
                <strong id="selectedTeamLabel">
                    自チーム
                </strong>
            </div>

            <div>
                <span>PLAYER</span>
                <strong id="selectedPlayerLabel">
                    -
                </strong>
            </div>

            <div>
                <span>POSITION</span>
                <strong id="selectedPositionLabel">
                    -
                </strong>
            </div>

            <div>
                <span>COURSE</span>
                <strong id="selectedCourseLabel">
                    -
                </strong>
            </div>

            <div>
                <span>RESULT</span>
                <strong id="selectedResultLabel">
                    -
                </strong>
            </div>

        </section>


        <!-- =========================
     ポジション・背番号
========================== -->

<section class="input-section">

    <div class="section-heading">
        <h2>ポジション・背番号</h2>
        <span>背番号は文字入力可能</span>
    </div>


        <div class="position-player-grid">

    <div class="position-player-card">
        <span class="position-label">LW</span>
        <input type="text" class="player-number-input"
               data-position-player="LW"
               placeholder="背番号"
               autocomplete="off">
    </div>

    <div class="position-player-card">
        <span class="position-label">PV</span>
        <input type="text" class="player-number-input"
               data-position-player="PV"
               placeholder="背番号"
               autocomplete="off">
    </div>

    <div class="position-player-card">
        <span class="position-label">RW</span>
        <input type="text" class="player-number-input"
               data-position-player="RW"
               placeholder="背番号"
               autocomplete="off">
    </div>

    <div class="position-player-card">
        <span class="position-label">LB</span>
        <input type="text" class="player-number-input"
               data-position-player="LB"
               placeholder="背番号"
               autocomplete="off">
    </div>

    <div class="position-player-card">
        <span class="position-label">CB</span>
        <input type="text" class="player-number-input"
               data-position-player="CB"
               placeholder="背番号"
               autocomplete="off">
    </div>

    <div class="position-player-card">
        <span class="position-label">RB</span>
        <input type="text" class="player-number-input"
               data-position-player="RB"
               placeholder="背番号"
               autocomplete="off">
    </div>

           <div class="position-player-card">
    <span class="position-label">EP</span>
    <input
        type="text"
        class="player-number-input"
        data-position-player="EP"
        placeholder="背番号"
        autocomplete="off">
</div>

<div class="position-player-card">
    <span class="position-label">GK</span>
    <input
        type="text"
        class="player-number-input"
        data-position-player="GK"
        placeholder="背番号"
        autocomplete="off">
</div> 

        </div>

</section>

        <!-- =========================
             シュートコース
        ========================== -->

        <section class="input-section">

            <div class="section-heading">

                <h2>シュートコース</h2>

                <span>
                    ワンタップで選択
                </span>

            </div>

            <div
                id="shotCourseGrid"
                class="shot-course-grid">

                <button type="button" data-course="UL">
                    UL
                </button>

                <button type="button" data-course="UC">
                    UC
                </button>

                <button type="button" data-course="UR">
                    UR
                </button>

                <button type="button" data-course="ML">
                    ML
                </button>

                <button type="button" data-course="MC">
                    MC
                </button>

                <button type="button" data-course="MR">
                    MR
                </button>

                <button type="button" data-course="LL">
                    LL
                </button>

                <button type="button" data-course="LC">
                    LC
                </button>

                <button type="button" data-course="LR">
                    LR
                </button>

            </div>

        </section>


        <!-- =========================
             結果
        ========================== -->

        <section class="input-section">

            <div class="section-heading">

                <h2>結果</h2>

            </div>

            <div class="result-grid">

    <button
        type="button"
        data-result="GOAL">
        GOAL
    </button>

    <button
        type="button"
        data-result="SAVE">
        SAVE
    </button>

    <button
        type="button"
        data-result="OUT">
        OUT
    </button>

    <button
        type="button"
        data-result="MISS">
        MISS
    </button>

</div>

        </section>


        <!-- =========================
             攻撃種類
        ========================== -->

        <section class="input-section">

            <div class="section-heading">

                <h2>攻撃</h2>

            </div>

            <div class="attack-grid">

                <button
                    type="button"
                    data-attack="SET">
                    SET
                </button>

                <button
                    type="button"
                    data-attack="FAST">
                    FAST
                </button>

                   <button
        type="button"
        data-attack="EMPTY">
        EMPTY
    </button>

                <button
                    type="button"
                    data-attack="7M">
                    7M
                </button>

            </div>

        </section>


        <!-- =========================
             OTHER
        ========================== -->

        <section class="other-section">

            <button
                type="button"
                id="otherButton"
                class="other-button">
                OTHER
            </button>

            <div
                id="otherMenu"
                class="other-menu hidden">

                <button
                    type="button"
                    data-other="MISS">
                    ミス
                </button>

                <button
                    type="button"
                    data-other="PENALTY">
                    ペナルティ
                </button>

                <button
                    type="button"
                    data-other="TIMEOUT">
                    タイムアウト
                </button>

                <button
                    type="button"
                    data-other="FREETHROW">
                    フリースロー
                </button>

                <button
                    type="button"
                    data-other="SUBSTITUTION">
                    選手交代
                </button>

            </div>

        </section>


        <!-- =========================
             保存
        ========================== -->

        <section class="save-section">

            <button
                type="button"
                id="saveEventButton"
                class="save-event-button">
                この記録を保存
            </button>

            <button
                type="button"
                id="clearInputButton"
                class="clear-input-button">
                入力をクリア
            </button>

        </section>


<!-- =========================
     EVENT HISTORY
========================= -->

<section class="history-section">

    <div class="section-heading">
        <h2>EVENT HISTORY</h2>
    </div>

    <div class="history-team-tabs">

        <button
            type="button"
            class="history-team-button active"
            data-history-team="home">
            自チーム
        </button>

        <button
            type="button"
            class="history-team-button"
            data-history-team="away">
            相手チーム
        </button>

    </div>

 <div class="history-columns">

    <div
        id="homeHistory"
        class="event-history hidden">
    </div>

    <div
        id="awayHistory"
        class="event-history hidden">
    </div>

</div>

</section>
        
        
        <!-- =========================
             試合終了
        ========================== -->

        <section class="finish-section">

            <button
                type="button"
                id="finishMatchButton"
                class="finish-button">
                試合終了・保存
            </button>

        </section>

    </section>

</main>


<!-- =========================
     OTHERモーダル
========================== -->

<div
    id="otherModal"
    class="modal-overlay hidden">

    <div class="modal">

        <div class="modal-header">

            <h2 id="otherModalTitle">
                OTHER
            </h2>

            <button
                type="button"
                id="closeOtherModal">
                ×
            </button>

        </div>


        <div
            id="otherModalContent"
            class="modal-content">

            <!-- JavaScriptで内容を生成 -->

        </div>

    </div>

</div>


</body>
</html>
